<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#ffffff"/>
<title>2XU — Chat with friends in real time</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet"/>

<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js" crossorigin="anonymous"></script>
<script>if(typeof mqtt==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"><\/script>');}</script>

<style>
/* ================= 2XU · Notion-style design tokens (light + dark follows system) ================= */
:root{
--bg:#fff;--pop:#fff;--sidebar:#f7f7f5;--hover:rgba(55,53,47,.06);--sel:rgba(55,53,47,.1);
--secondary:#37352f;--on-surface:#37352f;--tertiary:#73726e;--text:#73726e;--muted:#9b9a97;
--border:rgba(55,53,47,.09);--line:rgba(55,53,47,.16);--surface:#f1f1ef;--field:rgba(242,241,238,.6);
--primary:#2383e2;--primary-hover:#0b6ec5;--primary-soft:rgba(35,131,226,.16);--link:#0b6ec5;
--error:#e03e3e;--ok:#0f7b6c;--warn:#b35c00;--bub-in:#f1f1ef;--bub-out:#e7f3f8;--ring:var(--bg);
--r-sm:4px;--r-md:6px;--r-lg:8px;--r-xl:10px;
--shadow-sm:0 1px 2px rgba(15,15,15,.05);
--shadow-pop:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
--font-sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji";
--font-label:var(--font-sans);
--font-mono:SFMono-Regular,Menlo,Consolas,"PT Mono","Liberation Mono",Courier,monospace}
@media (prefers-color-scheme:dark){:root{
--bg:#191919;--pop:#252525;--sidebar:#202020;--hover:rgba(255,255,255,.055);--sel:rgba(255,255,255,.09);
--secondary:#ebebea;--on-surface:#d4d4d3;--tertiary:#9b9b9a;--text:#9b9b9a;--muted:#757574;
--border:rgba(255,255,255,.094);--line:rgba(255,255,255,.16);--surface:#2b2b2b;--field:#2b2b2b;
--primary-soft:rgba(35,131,226,.28);--link:#529cca;--error:#ff7369;--ok:#4dab9a;--warn:#ffa344;
--bub-in:#2b2b2b;--bub-out:#143a4e;
--shadow-pop:0 0 0 1px rgba(255,255,255,.07),0 3px 6px rgba(0,0,0,.4),0 9px 24px rgba(0,0,0,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font-sans);color:var(--on-surface);background:var(--bg);font-size:14px;line-height:20px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{touch-action:manipulation;cursor:pointer}
button,input,textarea{font:inherit;color:inherit}
::selection{background:rgba(35,131,226,.28)}
img{display:block}
#bgfx{display:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.inp:focus-visible,.ta:focus-visible{outline:none}
.scroll{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid transparent;background-clip:content-box}
.scroll::-webkit-scrollbar-track{background:transparent}

/* atoms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:var(--r-md);border:1px solid transparent;font-weight:500;font-size:14px;transition:background .12s,border-color .12s;user-select:none;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:transparent;color:var(--secondary);border-color:var(--line)}
.btn-secondary:hover{background:var(--hover)}
.btn-danger{background:transparent;color:var(--error);border-color:var(--line)}
.btn-danger:hover{background:rgba(224,62,62,.08)}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{height:28px;padding:0 10px;font-size:13px}
.btn-sm svg{width:14px;height:14px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--r-md);border:0;background:transparent;color:var(--tertiary);flex:none;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--hover);color:var(--secondary)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:#fff;font-size:11px;font-weight:600;line-height:1}
.inp{width:100%;height:34px;background:var(--field);border:0;border-radius:var(--r-md);padding:0 10px;font-size:14px;color:var(--on-surface);outline:none;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .12s,background .12s}
.inp::placeholder{color:var(--muted)}
.inp:focus{background:var(--bg);box-shadow:inset 0 0 0 1px var(--primary),0 0 0 3px var(--primary-soft)}
.inp.err{box-shadow:inset 0 0 0 1px var(--error),0 0 0 3px rgba(224,62,62,.16)}
.field{margin-bottom:14px}
.lbl{display:block;font-size:12px;font-weight:500;line-height:16px;color:var(--tertiary);margin-bottom:6px}
.hint{font-size:12px;line-height:16px;color:var(--tertiary);margin-top:6px}
.hint-error{color:var(--error)}
.hint-ok{color:var(--ok)}

/* avatars */
.avatar{position:relative;flex:none;border-radius:50%}
.avatar>img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar .initials{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
.p-dot{position:absolute;right:-2px;bottom:-2px;width:34%;min-width:9px;aspect-ratio:1;border-radius:50%;background:var(--ok);border:2px solid var(--ring)}
.p-dot.off{background:var(--muted)}
.logo-mark{width:22px;height:22px;border-radius:5px;background:var(--secondary);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;flex:none}
.brand-name{font-size:14px;font-weight:600;color:var(--secondary)}

/* auth */
.auth-wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:24px;overflow-y:auto;background:var(--bg)}
.brand-lockup{display:flex;align-items:center;gap:10px}
.brand-lockup .logo-mark{width:36px;height:36px;border-radius:8px}
.brand-lockup .brand-name{font-size:22px;font-weight:700;letter-spacing:-.02em}
.auth-hero{text-align:center;max-width:520px}
.auth-hero h1{font-size:clamp(28px,5vw,40px);font-weight:700;line-height:1.15;letter-spacing:-.025em;color:var(--secondary);margin:0 0 10px}
.auth-hero h1 em{font-style:normal}
.auth-hero p{font-size:16px;line-height:1.5;color:var(--text);margin:0}
.auth-card{width:min(420px,100%);background:var(--pop);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);padding:18px 24px 24px}
.auth-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.auth-tab{height:36px;padding:0 10px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0;background:transparent;color:var(--tertiary);font-weight:500;font-size:14px}
.auth-tab:hover{color:var(--secondary)}
.auth-tab.active{color:var(--secondary);border-bottom-color:var(--secondary)}
.id-row{display:flex;gap:8px}
.id-row .inp{flex:1}
.id-dice{width:34px;height:34px;flex:none;border:0;box-shadow:inset 0 0 0 1px var(--line);background:transparent;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:var(--tertiary)}
.id-dice:hover{background:var(--hover);color:var(--secondary)}
.id-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.id-status .sdot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.id-status.free,.id-status.free .sdot{color:var(--ok)} .id-status.free .sdot{background:var(--ok)}
.id-status.taken,.id-status.bad{color:var(--error)} .id-status.taken .sdot,.id-status.bad .sdot{background:var(--error)}
.pass-wrap{position:relative}
.pass-wrap .inp{padding-right:38px}
.pass-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:transparent;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pass-eye:hover{color:var(--secondary);background:var(--hover)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:24px;height:24px;border-radius:50%;border:0;transition:transform .1s}
.swatch:hover{transform:scale(1.1)}
.swatch.sel{box-shadow:0 0 0 2px var(--pop),0 0 0 4px var(--secondary)}
.pic-pick{width:72px;height:72px;border-radius:50%;position:relative;border:0;padding:0;background:transparent;flex:none}
.pic-pick>img,.pic-pick .initials{width:72px;height:72px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center}
.pic-pick .cam{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--secondary);color:var(--bg);border:2px solid var(--pop);display:flex;align-items:center;justify-content:center}
.vault-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.vault-chip{display:inline-flex;align-items:center;gap:8px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:transparent;border-radius:99px;padding:3px 10px 3px 4px;font-size:13px;font-weight:500;color:var(--secondary)}
.vault-chip:hover{background:var(--hover)}
.auth-foot{margin-top:14px;text-align:center;font-size:12px;line-height:16px;color:var(--tertiary)}
.auth-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* app shell + sidebar */
.shell{height:100dvh;display:flex;background:var(--bg)}
.sidebar{--ring:var(--sidebar);width:280px;min-width:280px;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--border)}
.side-head{padding:10px 10px 4px;display:flex;flex-direction:column;gap:8px}
.side-head>div:first-child{height:28px;padding:0 4px}
.conn-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tertiary);margin-left:auto;padding:0 4px}
.conn-pill .cdot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.conn-pill.live{color:var(--ok)} .conn-pill.live .cdot{background:var(--ok)}
.conn-pill.wait{color:var(--warn)} .conn-pill.wait .cdot{background:#f59e0b;animation:livePulse 1.2s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.35}}
.search-row{display:flex}
.search-box{position:relative;flex:1}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;width:15px;height:15px}
.search-box .inp{height:28px;padding:0 10px 0 30px;background:var(--hover);box-shadow:none}
.search-box .inp:focus{background:var(--bg);box-shadow:inset 0 0 0 1px var(--primary),0 0 0 3px var(--primary-soft)}
.side-body{flex:1;overflow-y:auto;padding:4px 8px 12px}
.side-sec{font-size:12px;font-weight:600;color:var(--tertiary);padding:14px 8px 4px;min-height:30px;display:flex;align-items:center;gap:8px}
.side-sec .badge{background:var(--error)}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:var(--r-md);padding:6px 8px;position:relative;transition:background .1s}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .rmain{flex:1;min-width:0}
.row .rname{font-weight:500;font-size:14px;line-height:20px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row:has(.unread-dot) .rname{font-weight:700}
.row .rprev{font-size:12.5px;line-height:17px;color:var(--tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rmeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.row .rtime{font-size:11px;color:var(--tertiary);font-variant-numeric:tabular-nums}
.row .unread-dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.req-acts{display:flex;gap:6px;margin-top:8px}
.pend-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:var(--r-md)}
.pend-row .pname{font-size:14px;color:var(--secondary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend-tag{font-family:var(--font-mono);font-size:11px;color:var(--tertiary)}
.side-empty{margin:12px 4px;padding:20px 16px;text-align:center;border-radius:var(--r-lg);background:var(--hover)}
.side-empty .se-icon{width:32px;height:32px;margin:0 auto 10px;border-radius:var(--r-md);background:var(--bg);color:var(--tertiary);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--border)}
.side-empty h4{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--secondary)}
.side-empty p{margin:0;font-size:13px;line-height:19px;color:var(--tertiary)}
.side-empty .btn{margin-top:12px}
.me-bar{border-top:1px solid var(--border);padding:8px 10px;display:flex;align-items:center;gap:8px}
.me-bar .mname{font-size:13px;font-weight:500;color:var(--secondary);line-height:17px}
.me-bar .mid{font-family:var(--font-mono);font-size:11px;color:var(--tertiary);letter-spacing:.03em}

/* thread */
.main{--ring:var(--bg);flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.thread-head{height:45px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px}
.th-names{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.th-name{font-weight:600;font-size:14px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-sub{font-size:12px;color:var(--tertiary);white-space:nowrap;flex:none}
.th-sub.online{color:var(--ok)} .th-sub.typing{color:var(--primary);font-weight:500}
.back-btn{display:none}
.menu-wrap{position:relative}
.menu{position:absolute;top:34px;right:0;z-index:60;min-width:200px;background:var(--pop);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);padding:4px;animation:popIn .14s ease-out both}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:var(--r-sm);padding:5px 10px;min-height:28px;font-size:14px;color:var(--secondary)}
.menu button svg{color:var(--tertiary)}
.menu button:hover{background:var(--hover)}
.menu button.danger,.menu button.danger svg{color:var(--error)}
@keyframes popIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.msgs{flex:1;overflow-y:auto;padding:20px max(16px,calc((100% - 780px)/2)) 12px;display:flex;flex-direction:column;gap:2px}
.day-sep{align-self:center;margin:16px 0 8px;font-size:12px;font-weight:500;color:var(--tertiary)}
.m-row{display:flex;align-items:flex-end;gap:8px;max-width:100%;animation:msgIn .2s ease-out both}
.m-row.mine{flex-direction:row-reverse}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.m-ava{width:28px;height:28px;flex:none;margin-bottom:2px}
.m-ava.ghost{visibility:hidden}
.m-stack{display:flex;flex-direction:column;gap:2px;max-width:min(72%,600px)}
.m-row.mine .m-stack{align-items:flex-end}
.m-bubble{padding:7px 12px;border-radius:var(--r-xl);font-size:15px;line-height:22px;overflow-wrap:break-word;word-break:break-word;white-space:pre-wrap;color:var(--on-surface)}
.m-row:not(.mine) .m-bubble{background:var(--bub-in);border-bottom-left-radius:3px}
.m-row.mine .m-bubble{background:var(--bub-out);border-bottom-right-radius:3px}
.m-bubble a{color:var(--link);text-decoration:underline;text-decoration-color:rgba(35,131,226,.4);text-underline-offset:2px}
.m-meta{display:flex;align-items:center;gap:4px;padding:0 4px;font-size:11px;color:var(--tertiary);font-variant-numeric:tabular-nums;height:16px}
.m-ticks{display:inline-flex;color:var(--muted)}
.m-ticks.read{color:var(--primary)}
.img-msg{max-width:100%;border-radius:var(--r-md);overflow:hidden;position:relative;background:var(--surface);min-height:80px;display:flex;flex-direction:column}
.img-msg img{max-width:100%;max-height:320px;width:auto;min-width:0;object-fit:cover;cursor:zoom-in}
.img-msg .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.xfer{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0}
.xfer .xi{width:34px;height:34px;border-radius:var(--r-md);flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tertiary);box-shadow:0 0 0 1px var(--border)}
.xfer .xmain{flex:1;min-width:0}
.xfer .xname{font-size:14px;font-weight:500;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xfer .xsub{font-size:12px;color:var(--tertiary);line-height:16px;margin-top:1px}
.bar{height:3px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.xbtn{margin-top:8px;border:0;border-radius:var(--r-md);height:28px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:var(--primary);color:#fff;transition:background .12s}
.xbtn:hover{background:var(--primary-hover)}
.xbtn.ghost,.m-row.mine .xbtn{background:transparent;color:var(--secondary);box-shadow:inset 0 0 0 1px var(--line)}
.xbtn.ghost:hover,.m-row.mine .xbtn:hover{background:var(--hover)}
.typing-row{display:flex;align-items:flex-end;gap:8px}
.typing-bubble{background:var(--bub-in);border-radius:var(--r-xl);border-bottom-left-radius:3px;padding:11px 14px;display:inline-flex;gap:4px}
.typ-dot{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:typDot 1.15s ease-in-out infinite}
.typ-dot:nth-child(2){animation-delay:.15s}.typ-dot:nth-child(3){animation-delay:.3s}
@keyframes typDot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.jump-btn{position:absolute;right:max(16px,calc((100% - 780px)/2));bottom:84px;width:32px;height:32px;border-radius:50%;background:var(--pop);border:0;box-shadow:var(--shadow-pop);color:var(--secondary);display:none;align-items:center;justify-content:center;z-index:5}
.jump-btn.show{display:flex}
.empty-pane{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:32px;text-align:center}
.empty-pane .ep-icon{width:56px;height:56px;color:var(--muted);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.empty-pane .ep-icon svg{width:44px;height:44px}
.empty-pane h3{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--secondary)}
.empty-pane p{margin:0;font-size:15px;line-height:1.55;color:var(--text);max-width:400px}
.ep-steps{display:flex;flex-direction:column;gap:6px;margin-top:20px;width:min(380px,100%)}
.ep-step{display:flex;align-items:center;gap:12px;text-align:left;background:var(--hover);border-radius:var(--r-lg);padding:10px 12px}
.ep-step .n{width:22px;height:22px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1px var(--line);color:var(--secondary);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.ep-step .t{font-size:14px;color:var(--secondary);line-height:20px}
.ep-step .t b{font-weight:600}

/* composer */
.composer{flex:none;padding:8px max(16px,calc((100% - 780px)/2)) calc(16px + env(safe-area-inset-bottom));position:relative}
.comp-box{display:flex;align-items:flex-end;gap:2px;background:var(--bg);border-radius:var(--r-lg);padding:4px 6px;box-shadow:inset 0 0 0 1px var(--line),var(--shadow-sm);transition:box-shadow .12s}
.comp-box:focus-within{box-shadow:inset 0 0 0 1px var(--primary),0 0 0 3px var(--primary-soft)}
.comp-box .ta{flex:1;border:0;outline:0;background:transparent;resize:none;font-size:15px;line-height:22px;max-height:132px;padding:6px;color:var(--on-surface)}
.comp-box .ta::placeholder{color:var(--muted)}

  const t = h('div', { class: 'toast' + (kind === 'err' ? ' err' : kind === 'ok' ? ' ok' : '') },
    h('span', { class: 'ti' }, icon(kind === 'err' ? 'alert' : 'check', 13, 3)),
    h('span', {}, msg));
  root.append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, 2600);
  while (root.children.length > 3) root.firstChild.remove();
}
async function copyText(txt, okMsg) {
  const done = () => toast(okMsg || 'Copied', 'ok');
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(txt); done(); return; } } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.append(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove(); done();
}

/* ---------------- auth screens ---------------- */
const AU = { tab: 'create', name: '', idv: newChatId(), color: AV_COLORS[Math.floor(Math.random() * AV_COLORS.length)], pic: '',
  pass: '', pass2: '', showPass: false, chk: 'idle', busy: false,

function idFromName(nm) {
  const base = normId(nm);
  if (base.length < 2) return newChatId();
  const digs = n => Array.from({ length: n }, () => String(Math.floor(Math.random() * 10))).join('');
  const pats = [
    () => base.slice(0, 3 + Math.floor(Math.random() * 3)) + digs(2 + Math.floor(Math.random() * 3)),
    () => 'ITS' + base.slice(0, 2 + Math.floor(Math.random() * 2)) + digs(2 + Math.floor(Math.random() * 3)),
    () => base.slice(0, 2) + 'CHAT' + digs(1 + Math.floor(Math.random() * 3)),
  ];
  return pats[Math.floor(Math.random() * pats.length)]();
}
function buildAuth() {

function createPane() {
  const pane = h('div', { class: 'auth-pane' });
  const st = AU;
  const nameInp = h('input', { class: 'inp', placeholder: 'Your name', maxlength: '24', value: st.name, autocomplete: 'name' });
  const idInp = h('input', { class: 'inp', placeholder: 'Pick an ID (3–14 letters)', maxlength: '14', value: st.idv, autocomplete: 'off', spellcheck: 'false', style: { textTransform: 'uppercase', fontFamily: 'var(--font-mono)', letterSpacing: '.06em' } });

  const pass2Inp = h('input', { type: st.showPass ? 'text' : 'password', class: 'inp', placeholder: 'Repeat password', maxlength: '40', autocomplete: 'new-password' });

  const drawStatus = () => {
    statusLine.innerHTML = '';
    const target = normId(idInp.value);
    if (!target.length) { statusLine.append(h('span', { class: 'hint' }, '3–14 letters and numbers — friends will find you by this.')); return; }
    if (target.length < 3) { statusLine.append(h('span', { class: 'id-status bad' }, h('span', { class: 'sdot' }), 'Too short — use at least 3 characters')); return; }
    if (st.chk === 'checking') statusLine.append(h('span', { class: 'id-status', style: { color: 'var(--tertiary)' } }, h('span', { class: 'sdot' }), 'Checking availability…'));
    else if (st.chk === 'taken') statusLine.append(h('span', { class: 'id-status taken' }, h('span', { class: 'sdot' }), 'Already taken — try another'));
    else if (st.chk === 'removed') statusLine.append(h('span', { class: 'id-status bad' }, h('span', { class: 'sdot' }), 'This ID was removed and cannot be reused'));
    else statusLine.append(h('span', { class: 'id-status free' }, h('span', { class: 'sdot' }), chunkCode(target) + ' is available'));
  };
  const sync = () => {
    st.name = nameInp.value; st.idv = idInp.value; st.pass = passInp.value; st.pass2 = pass2Inp.value; st.err = null;
    errLine.textContent = '';
    const target = normId(st.idv);
    const idOk = target.length >= 3 && target.length <= 14;
    const passOk = st.pass.length >= 4;
    const match = st.pass === st.pass2;
    cta.disabled = !(st.name.trim().length >= 1 && idOk && st.chk !== 'checking' && st.chk !== 'taken' && st.chk !== 'removed' && passOk && match && !st.busy);
    const t2 = passInp.value, t3 = pass2Inp.value;
    pass2Inp.classList.toggle('err', !!(t3 && t2 && t3 !== t2));

  };

  let chkTimer = null;
  idInp.addEventListener('input', () => { clearTimeout(chkTimer); st.chk = 'idle'; drawStatus(); sync();
    chkTimer = setTimeout(async () => {
      const target = normId(idInp.value);
      if (target.length < 3) { st.chk = 'idle'; drawStatus(); sync(); return; }
      st.chk = 'checking'; drawStatus(); sync();
      const p = await fetchProfile(target);
      if (normId(idInp.value) !== target) return;
      if (p) { st.chk = 'taken'; drawStatus(); sync(); return; }
      const tomb = await pullRetained(REMOVED_TOPIC(target), d => d && d.app === APP && d.type === 'removed' && d.id === target, { timeout: 3200, fastMs: 1600 });
      if (normId(idInp.value) !== target) return;

  });
  nameInp.addEventListener('input', sync);
  passInp.addEventListener('input', sync);
  pass2Inp.addEventListener('input', sync);
  pass2Inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !cta.disabled) cta.click(); });
  passInp.addEventListener('keydown', e => { if (e.key === 'Enter') pass2Inp.focus(); });
  idInp.addEventListener('keydown', e => { if (e.key === 'Enter') passInp.focus(); });
  const eye = h('button', { type: 'button', class: 'pass-eye', 'aria-label': 'Show passwords', onclick: () => { st.showPass = !st.showPass; const t = st.showPass ? 'text' : 'password'; passInp.type = t; pass2Inp.type = t; eye.innerHTML = ''; eye.append(icon(st.showPass ? 'eyeOff' : 'eye', 15)); } }, icon('eye', 15));

  cta.addEventListener('click', async () => {
    st.busy = true; st.err = null; errLine.textContent = ''; cta.disabled = true;
    cta.innerHTML = ''; cta.append(h('span', { class: 'auth-spin' }), h('span', {}, 'Creating…'));
    const res = await createIdentity({ name: st.name, id: st.idv, color: st.color, pic: st.pic, password: st.pass });

      st.busy = false;
      cta.innerHTML = ''; cta.append('Create my ID');
      if (res.taken) { st.chk = 'taken'; drawStatus(); st.err = 'That ID was just taken — pick another.'; }

  drawStatus(); sync();

}
function profilePickerWrapper(picker, swr) {

function signinPane() {
  const pane = h('div', { class: 'auth-pane' });
  const st = AU;
  const idInp = h('input', { class: 'inp', placeholder: 'Your ID', maxlength: '14', value: st.siId, autocomplete: 'username', spellcheck: 'false', style: { textTransform: 'uppercase', fontFamily: 'var(--font-mono)', letterSpacing: '.06em' } });
  const passInp = h('input', { type: st.siShow ? 'text' : 'password', class: 'inp', placeholder: 'Password', maxlength: '40', autocomplete: 'current-password' });
  passInp.value = st.siPass;
  const statusLine = h('div', { class: 'hint', style: { minHeight: '16px', marginTop: '6px' } }, st.siErr || '');
  const cta = h('button', { class: 'btn btn-primary btn-block', style: { marginTop: '12px' } }, 'Sign in');
  const eye = h('button', { type: 'button', class: 'pass-eye', 'aria-label': 'Show password', onclick: () => { st.siShow = !st.siShow; passInp.type = st.siShow ? 'text' : 'password'; eye.innerHTML = ''; eye.append(icon(st.siShow ? 'eyeOff' : 'eye', 15)); } }, icon('eye', 15));
  const sync = () => { st.siId = idInp.value; st.siPass = passInp.value; st.siErr = null; statusLine.textContent = ''; cta.disabled = !(normId(st.siId).length >= 3 && st.siPass.length >= 1 && !st.siBusy); };
  idInp.addEventListener('input', sync); passInp.addEventListener('input', sync);
  const submit = async () => {
    if (cta.disabled) return;
    st.siBusy = 'lookup'; statusLine.className = 'hint'; statusLine.textContent = 'Reaching the network…'; cta.disabled = true;
    cta.innerHTML = ''; cta.append(h('span', { class: 'auth-spin' }), h('span', {}, 'Signing in…'));
    const res = await signIn(st.siId, st.siPass, step => {
      st.siBusy = step;
      statusLine.textContent = step === 'live' ? 'Asking online devices…' : step === 'cloud' ? 'Checking cloud snapshot…' : 'Looking up ' + chunkCode(normId(st.siId)) + '…';
    });
    if (res.ok) return;
    st.siBusy = null; cta.innerHTML = ''; cta.append('Sign in'); sync();
    statusLine.className = 'hint hint-error';
    statusLine.textContent =
      res.wrong ? 'Wrong password for that ID.' :
      res.notfound ? 'No account with that ID found on the network.' :
      res.net ? 'Could not reach the network — check your connection.' :
      res.bad ? 'IDs are 3–14 letters and numbers.' : 'Could not sign in — try again.';
  };
  cta.addEventListener('click', submit);
  passInp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  idInp.addEventListener('keydown', e => { if (e.key === 'Enter') passInp.focus(); });
  pane.append(h('div', { class: 'field' }, h('label', { class: 'lbl' }, 'Your ID'), idInp),
    h('div', { class: 'field' }, h('label', { class: 'lbl' }, 'Password'), h('div', { class: 'pass-wrap' }, passInp, eye)),
    statusLine, cta);
  /* vault quick chips — IDs this device remembers */
  const entries = Object.values(vaultAll()).filter(v => v.id);
  if (entries.length) {
    const row = h('div', { class: 'vault-row' });
    entries.slice(0, 6).forEach(v => row.append(h('button', { class: 'vault-chip', onclick: () => { idInp.value = v.id; sync(); passInp.focus(); } },
      avatarEl({ name: v.name, color: v.color, pic: v.pic }, 22), h('span', {}, v.name || v.id))));
    pane.prepend(h('div', {}, h('div', { class: 'lbl' }, 'On this device'), row));
  }
  pane.append(h('div', { class: 'auth-foot' }, 'Signing in restores your friends and chats from the cloud.'));
  sync();
  return pane;
}

<script>

/* ---------------- sidebar list ---------------- */
function renderSidebarList() {
  const box = $id('side-list'); if (!box) return;

    .filter(f => !q || (f.name || '').toLowerCase().includes(q) || f.id.toLowerCase().includes(q))
    .sort((a, b) => {
      const ta = (lastOf(a.id) || {}).ts || a.since || 0;
      const tb = (lastOf(b.id) || {}).ts || b.since || 0;
      return tb - ta;
    });

  if (inReqs.length) {
    box.append(h('div', { class: 'side-sec' }, 'Friend requests', h('span', { class: 'badge' }, inReqs.length)));
    inReqs.forEach(r => {
      box.append(h('div', { style: { background: 'var(--surface)', borderRadius: '12px', padding: '10px', marginBottom: '8px' } },
        h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } },

    h('button', { class: 'btn btn-danger', onclick: () => { closeSheet(); confirmSheet('Remove ' + (f.name || 'friend') + '?', 'They will be removed from your chats and you from theirs.', 'Remove', () => unfriend(fid)); } }, icon('trash', 16), 'Remove'));
  openSheet(f.name || fid, [
    h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '10px', padding: '8px 0 16px' } },
      avatarEl(f, 84, null),
      h('div', { style: { fontWeight: '600', fontSize: '18px', color: 'var(--secondary)' } }, f.name || fid),
      idChip(f.id, true),
      since ? h('div', { class: 'hint' }, 'Friends since ' + since) : h('div', { class: 'hint' }, !!S.presence[fid] ? 'Online now' : 'Offline')),
    h('button', { class: 'btn btn-primary btn-block', onclick: () => { closeSheet(); openThread(fid); } }, 'Open chat'),
  ], { footer: foot });
}
</script>
<script>
/* =====================================================================
   BOOT
   ===================================================================== */
(function boot() {
  const fiAny = $id('fi-any');
  const fiImg = $id('fi-img');
  fiAny.multiple = true;
  const handleFiles = e => {
    const fs = Array.from(e.target.files || []);
    e.target.value = '';
    if (!fs.length) return;
    if (!S.me) return;
    const fid = S.view;
    if (!S.friends[fid]) { toast('Open a chat first, then attach files', 'err'); return; }
    fs.forEach(f => attachFile(fid, f));
  };
  fiAny.addEventListener('change', handleFiles);
  fiImg.addEventListener('change', handleFiles);

  /* typing indicator expiry */
  setInterval(() => {
    const now = Date.now(); let ch = false;
    Object.keys(S.typing).forEach(k => { if (S.typing[k] <= now) { delete S.typing[k]; ch = true; } });
    if (ch) scheduleRender();
  }, 1200);

  /* presence heartbeat so flaky brokers don't leave ghosts behind */
  setInterval(() => {
    if (S.me && S.online && mc) {
      try { mc.publish(tOf('presence', S.me.id), JSON.stringify({ app: APP, on: 1, t: Date.now() }), { qos: 0, retain: true }); } catch (e) {}
    }
  }, 60000);

  const bye = () => {
    const me = S.me;
    if (me && mc) {
      try { mc.publish(tOf('presence', me.id), '', { qos: 0, retain: true }); } catch (e) {}
      try { mc.end(true); } catch (e) {}
    }
  };
  window.addEventListener('beforeunload', bye);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && S.me && S.view !== 'home') markRead(S.view);
  });

  renderApp();
})();
</script>
</body>
</html>
