<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>COSPACE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single-page file workspace. Header on top, navigation left, files in the middle, a details panel on the right. */
:root {
  --font: "Anthropic Sans", "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f8f9fb;
  --line: #e3e7ee; --line-strong: #cfd5df;
  --text: #0f1a2b; --muted: #566277; --faint: #8993a6;
  --accent: #1d5cf0; --accent-ink: #ffffff; --accent-soft: #e6eeff; --accent-line: #b9cdfb;
  --hover: #eef1f6; --danger: #d92d20;
  --shadow-sm: 0 1px 2px rgba(15, 26, 43, .06);
  --shadow-md: 0 10px 30px rgba(15, 26, 43, .16), 0 0 0 1px rgba(15, 26, 43, .05);
  --scrim: rgba(15, 26, 43, .45);
  --folder: #f3b63f; --folder-dark: #dd9d22;
  --red: #f04438; --orange: #f79009; --yellow: #eab308; --green: #12b76a; --blue: #2e90fa; --purple: #7a5af8; --gray: #98a2b3;
  --k-image: #12b76a; --k-video: #7a5af8; --k-audio: #ee46bc; --k-doc: #2e90fa; --k-sheet: #039855; --k-archive: #f79009; --k-code: #6172f3; --k-text: #667085; --k-other: #475467;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --surface: #151b24; --surface-2: #1a212c; --line: #252d3a; --line-strong: #333d4d;
    --text: #edf1f7; --muted: #9ba6b8; --faint: #6c778a;
    --accent: #5a8dff; --accent-ink: #0a1020; --accent-soft: #1a2a4f; --accent-line: #2d4378; --hover: #1e2632; --danger: #f97066;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow-md: 0 10px 30px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .06); --scrim: rgba(0, 0, 0, .6);
    --folder: #e0a935; --folder-dark: #c48d1c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #151b24; --surface-2: #1a212c; --line: #252d3a; --line-strong: #333d4d;
  --text: #edf1f7; --muted: #9ba6b8; --faint: #6c778a;
  --accent: #5a8dff; --accent-ink: #0a1020; --accent-soft: #1a2a4f; --accent-line: #2d4378; --hover: #1e2632; --danger: #f97066;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow-md: 0 10px 30px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .06); --scrim: rgba(0, 0, 0, .6);
  --folder: #e0a935; --folder-dark: #c48d1c; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }
.only-sm { display: none !important; }
[hidden] { display: none !important; }

/* App shell */
#app { position: fixed; inset: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); display: flex; flex-direction: column; background: var(--bg); }
.top { flex: none; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; width: 204px; flex: none; color: var(--text); text-decoration: none; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.logo svg { width: 18px; height: 18px; stroke: var(--accent-ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.search { position: relative; flex: 1 1 420px; max-width: 560px; }
.search input { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 56px 0 38px; outline: none; transition: border-color .12s, box-shadow .12s, background .12s; }
.search input::placeholder { color: var(--faint); }
.search input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
.search > svg { position: absolute; left: 12px; top: 10px; width: 18px; height: 18px; stroke: var(--faint); fill: none; stroke-width: 1.9; stroke-linecap: round; }
.search kbd { position: absolute; right: 10px; top: 9px; font: 500 11px var(--font); color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--surface); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.btn, .btn-p, .btn-g { height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:disabled, .btn-p:disabled { opacity: .45; cursor: default; }
.btn-p { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-p:hover:not(:disabled) { filter: brightness(1.08); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn svg, .btn-p svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ib { width: 36px; height: 36px; border-radius: 9px; border: 1px solid transparent; background: none; display: inline-grid; place-items: center; color: var(--muted); flex: none; }
.ib:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.ib:disabled { opacity: .35; cursor: default; }
.ib.on { background: var(--accent-soft); color: var(--accent); }
.ib svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.fn { position: relative; }
.fn-main { flex: 1; min-height: 0; display: flex; }
.sidebar { width: 244px; flex: none; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 10px 16px; display: flex; flex-direction: column; }
.sb-h { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); padding: 16px 10px 6px; display: flex; justify-content: space-between; align-items: center; }
.sb-h:first-child { padding-top: 4px; }
.sb-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 8px; color: var(--text); }
.sb-item:hover { background: var(--hover); }
.sb-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sb-item.drop { background: var(--accent-soft); outline: 2px solid var(--accent); }
.sb-item .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item .cnt { color: var(--faint); font-size: 12px; font-weight: 500; }
.sb-ic { width: 18px; height: 18px; flex: none; display: grid; place-items: center; }
.sb-ic svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sb-item:not(.active) .sb-ic svg { stroke: var(--muted); }
.sb-foot { margin-top: auto; padding-top: 14px; }
.meter-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface-2); }
.meter-card .t { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
.meter-card .s { color: var(--muted); font-size: 12px; margin-top: 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; min-width: 2px; }
.tagdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

.fn-right { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.fn-tb { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 16px; background: var(--bg); flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1 1 200px; overflow: hidden; white-space: nowrap; margin-left: 4px; }
.crumb { border: 0; background: none; padding: 4px 8px; border-radius: 7px; font-size: 15px; font-weight: 600; color: var(--muted); }
button.crumb:hover { background: var(--hover); color: var(--text); }
.crumb:last-child { color: var(--text); }
.crumbs .sep { color: var(--faint); }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; height: 30px; width: 34px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
.seg button:hover { color: var(--text); }
.seg button svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.sel-in { height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; outline: none; }
.work { flex: 1; min-height: 0; display: flex; padding: 0 16px 0; gap: 16px; }
.content { flex: 1; min-width: 0; min-height: 0; overflow: auto; position: relative; padding: 14px; outline: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px 12px 0 0; border-bottom: 0; user-select: none; -webkit-user-select: none; }
.insp { width: 320px; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px 12px 0 0; border-bottom: 0; overflow: auto; display: none; }
.fn.insp-on .insp { display: block; }
.statusbar { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 20px; color: var(--muted); font-size: 12.5px; background: var(--surface); border-top: 1px solid var(--line); }
.statusbar .bar { width: 100px; display: inline-block; vertical-align: 1px; margin-left: 8px; }
.banner { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--accent-line); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.dropveil { position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent-soft) 88%, transparent); display: none; place-items: center; font-size: 17px; font-weight: 600; color: var(--accent); z-index: 20; pointer-events: none; }
.dropveil.on { display: grid; }
.empty { min-height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 32px; }
.empty b { display: block; font-size: 17px; color: var(--text); margin-bottom: 6px; }
.empty .btn-p { margin-top: 16px; }
.empty .em-ic { width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 14px; }
.empty .em-ic svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* Icon view */
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 116px), 1fr)); gap: 8px; align-content: start; }
.fi { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 8px; border-radius: 10px; text-align: center; min-width: 0; position: relative; border: 1px solid transparent; }
.fi:hover { background: var(--hover); }
.fi.sel { background: var(--accent-soft); border-color: var(--accent-line); }
.fi.drop { outline: 2px solid var(--accent); background: var(--accent-soft); }
.fi .thumb { width: var(--ico, 64px); height: var(--ico, 64px); display: grid; place-items: center; position: relative; }
.fi .thumb img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 0 0 1px var(--line), var(--shadow-sm); background: #fff; object-fit: contain; }
.fi .nm { font-size: 13px; line-height: 1.25; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; padding: 1px 4px; border-radius: 4px; }
.fi .badges { position: absolute; right: 6px; top: 6px; display: flex; gap: 2px; }
.fi .star, .lrow .star { color: var(--yellow); font-size: 13px; }
.fi .tagdots { display: flex; gap: 3px; }
.fi .tagdots .tagdot { width: 7px; height: 7px; }
.rename { width: 100%; text-align: center; border: 1.5px solid var(--accent); border-radius: 5px; background: var(--surface); padding: 1px 3px; outline: none; user-select: text; -webkit-user-select: text; }

/* File and folder glyphs */
.kicon { width: 100%; height: 100%; position: relative; display: grid; place-items: end center; }
.kicon .pg { width: 76%; height: 100%; border-radius: 6px 14px 6px 6px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow-sm); position: relative; overflow: hidden; }
.kicon .pg::before { content: ""; position: absolute; right: 0; top: 0; width: 28%; aspect-ratio: 1; background: linear-gradient(225deg, var(--bg) 50%, color-mix(in srgb, var(--kc) 30%, var(--surface)) 50%); }
.kicon .ex { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: var(--kc); color: #fff; font-size: calc(var(--ico, 64px) * .17); font-weight: 700; display: grid; place-items: center; letter-spacing: .03em; text-transform: uppercase; overflow: hidden; }
.kicon .gl { position: absolute; left: 0; right: 0; top: 16%; height: 42%; display: grid; place-items: center; }
.kicon .gl svg { width: 52%; height: 100%; stroke: var(--kc); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fold { width: 100%; height: 80%; position: relative; align-self: end; }
.fold::before { content: ""; position: absolute; left: 4%; top: 0; width: 40%; height: 20%; border-radius: 6px 6px 0 0; background: var(--folder-dark); }
.fold::after { content: ""; position: absolute; left: 4%; right: 4%; top: 12%; bottom: 0; border-radius: 6px 8px 8px 8px; background: var(--folder); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
.fold.trash { filter: grayscale(1) opacity(.7); }

/* List view */
.list { width: 100%; border-collapse: collapse; }
.list th { position: sticky; top: -14px; background: var(--surface); text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 2; }
.list th button { border: 0; background: none; padding: 0; color: inherit; font-weight: inherit; }
.list th button:hover { color: var(--text); }
.list td { padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; border-bottom: 1px solid var(--line); color: var(--muted); }
.list td.nm { max-width: 340px; color: var(--text); font-weight: 500; }
.list tbody tr:hover td { background: var(--hover); }
.list tbody tr.sel td { background: var(--accent-soft); }
.list tbody tr.drop td { background: var(--accent-soft); }
.lrow { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lrow .mini { width: 22px; height: 22px; flex: none; display: grid; place-items: center; --ico: 22px; }
.lrow .mini img { width: 22px; height: 22px; object-fit: cover; border-radius: 4px; }
.lrow .mini .kicon .ex { display: none; } .lrow .mini .kicon .gl { top: 22%; height: 56%; }
.lrow span.t { overflow: hidden; text-overflow: ellipsis; }

/* Gallery */
.gal { display: flex; flex-direction: column; height: 100%; gap: 10px; }
.gal-main { flex: 1; min-height: 140px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; padding: 12px; }
.gal-main img, .gal-main video { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: var(--shadow-md); }
.gal-strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; flex: none; }
.gal-strip .fi { flex: 0 0 92px; }
.marquee { position: absolute; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); pointer-events: none; z-index: 3; }

/* Menus, toasts, dialogs */
.dropdown { position: fixed; z-index: 1000; min-width: 230px; padding: 6px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-md); border: 1px solid var(--line); }
.mi { display: flex; align-items: center; justify-content: space-between; gap: 24px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: 7px; text-align: left; }
.mi:hover:not(:disabled) { background: var(--hover); }
.mi:disabled { color: var(--faint); cursor: default; }
.mi .kbd { color: var(--faint); font-size: 12px; white-space: nowrap; }
.mi .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
.mi .check { width: 16px; display: inline-block; color: var(--accent); }
.msep { height: 1px; background: var(--line); margin: 6px 4px; }
.tagpick { display: flex; gap: 8px; flex-wrap: wrap; }
.tagpick button { border: 0; background: none; padding: 3px; border-radius: 50%; }
.tagpick button .tagdot { width: 18px; height: 18px; }
.tagpick button.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
#toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 1200; display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--text); color: var(--bg); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-md); animation: rise .18s ease-out; pointer-events: auto; }
.toast b { display: block; font-weight: 600; }
.toast .sub { opacity: .75; font-size: 12.5px; }
.prog { height: 4px; border-radius: 2px; background: rgba(127, 127, 127, .35); margin-top: 8px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
#scrim { position: fixed; inset: 0; z-index: 1100; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
#scrim[hidden], #ql[hidden] { display: none !important; }
.dlg { width: min(400px, 100%); background: var(--surface); border-radius: 14px; padding: 22px; box-shadow: var(--shadow-md); animation: rise .15s ease-out; }
.dlg h3 { margin: 0 0 6px; font-size: 17px; }
.dlg p { margin: 0 0 16px; color: var(--muted); }
.dlg input[type=text] { width: 100%; height: 38px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 12px; margin-bottom: 16px; outline: none; }
.dlg input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.dlg .btns { display: flex; justify-content: flex-end; gap: 8px; }
.sb-item.pf { padding-top: 6px; padding-bottom: 6px; }

/* Preview modal */
#ql { position: fixed; inset: 0; z-index: 1050; background: var(--scrim); display: grid; place-items: center; padding: 20px; }
.ql-box { width: min(1000px, 100%); height: min(720px, 100%); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; overflow: hidden; animation: rise .15s ease-out; }
.ql-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--line); }
.ql-title { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ql-foot { flex: none; padding: 10px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; gap: 12px; }
.ql { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px; gap: 12px; overflow: auto; background: var(--surface-2); }
.ql img, .ql video { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: var(--shadow-md); }
.ql audio { width: min(460px, 100%); }
.ql pre { margin: 0; width: 100%; height: 100%; overflow: auto; padding: 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; text-align: left; }
.ql .tbl { width: 100%; height: 100%; overflow: auto; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.ql table { border-collapse: collapse; font-size: 13px; width: 100%; }
.ql th, .ql td { padding: 7px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
.ql th { position: sticky; top: 0; background: var(--surface-2); font-weight: 600; }
.ql .thumb { display: grid; place-items: center; }
.ql .meta { color: var(--muted); text-align: center; max-width: 440px; }
.ql .meta b { color: var(--text); display: block; font-size: 16px; overflow-wrap: anywhere; margin-bottom: 4px; }

/* Pages: Storage and Settings */

  const act = a.dataset.s;
  if (act === 'persist') { try { const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; toast(ok ? 'Storage is now persistent' : 'The browser declined', ok ? 'Your files are protected from automatic clean-up.' : 'It may allow this later, after you use the page more.'); } catch (err) { toast('Not supported in this browser'); } updateQuota(); }

  else if (act === 'open') openInfo(items.get(a.dataset.id));
}

    } else if (d.k === 'leaf') {
      d.y += d.vy * dt; d.x += Math.sin(t * 1.3 + d.ph) * 12 * dt + 3 * dt; if (d.y > H + 3) { d.y = -3; d.x = rnd(0, W); } if (d.x > W + 3) d.x = -3;
      g.fillStyle = d.c; g.fillRect(R(d.x), R(d.y), 2, 1); g.fillRect(R(d.x) + (Math.sin(t * 3 + d.ph) > 0 ? 1 : 0), R(d.y) + 1, 1, 1);
    } else if (d.k === 'snow') {
      d.y += d.vy * dt; d.x += Math.sin(t + d.ph) * 6 * dt; if (d.y > H + 2) { d.y = -2; d.x = rnd(0, W); }
      g.globalAlpha = d.z === 2 ? 1 : .85; g.fillStyle = '#ffffff'; g.fillRect(R(d.x), R(d.y), d.z, d.z); g.globalAlpha = 1;
    }
  });
  if (cfg.extra.indexOf('shoot') >= 0) {
    if (!FX.shoot && t > FX.nextShoot) FX.shoot = { x: rnd(W * .3, W * .9), y: rnd(G.top, G.top + (G.bot - G.top) * .4), life: 0 };
    const sh = FX.shoot;
    if (sh) {
      sh.life += dt; sh.x -= 95 * dt; sh.y += 45 * dt; g.fillStyle = '#ffffff';
      for (let i = 0; i < 7; i++) { g.globalAlpha = Math.max(0, (1 - i / 7) * (1 - sh.life / .9)); g.fillRect(R(sh.x + i * 2.1), R(sh.y - i), 1, 1); }
      g.globalAlpha = 1; if (sh.life > .9) { FX.shoot = null; FX.nextShoot = t + rnd(7, 14); }
    }
  }
}
function applyFx() {
  const ok = P.fx !== false && !!FXC[P.bg] && document.body.classList.contains('has-bg') && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  document.body.classList.toggle('has-fx', ok);
  if (!ok) { if (FX.raf) cancelAnimationFrame(FX.raf); FX.raf = 0; FX.id = null; return; }
  if (FX.id !== P.bg) { FX.id = P.bg; fxInit(P.bg); }
  if (!FX.raf) { FX.last = performance.now(); FX.raf = requestAnimationFrame(fxFrame); }
}

function bgSettingsHTML() {
  const tile = (id, name, src) => '<button class="bg-opt' + (P.bg === id ? ' on' : '') + '" data-bg="' + id + '" style="background-image:url(\'' + src + '\')" aria-label="' + name + '" aria-pressed="' + (P.bg === id) + '"><span>' + name + '</span></button>';
  return '<h4>Background</h4><div class="panel" style="margin-bottom:18px"><div class="bg-grid">' + BGS.map(b => tile(b.id, b.name, b.src)).join('') + (customBgUrl ? tile('custom', 'Your image', customBgUrl) : '') +
    '<button class="bg-opt plain" data-bg-up="1"><span>+ Upload image</span></button><button class="bg-opt plain' + (P.bg === 'none' ? ' on' : '') + '" data-bg="none"><span>No background</span></button></div>' +
    '<div class="sw-row"><div>Animated scenery<small>Drifting clouds, birds and weather on the built-in backgrounds</small></div><div class="choices">' + [[true, 'On'], [false, 'Off']].map(o => '<button data-k="fx" data-pv="' + o[0] + '" class="' + ((P.fx !== false) === o[0] ? 'on' : '') + '">' + o[1] + '</button>').join('') + '</div></div>' +
    '<div class="sw-row"><div>Overlay<small>Softens the picture so text stays readable</small></div><input type="range" id="bg-dim" min="0" max="85" step="5" value="' + P.dim + '" aria-label="Background overlay"></div></div>';
}
async function setCustomBg(file) {
  if (!file || !/^image\//.test(file.type)) { toast('Please choose an image file'); return; }
  if (file.size > 25 * 1024 * 1024) { toast('That image is too large', 'Please choose one under 25 MB.'); return; }
  let saved = true; try { await DB.setKV('bgimg', file); } catch (e) { saved = false; }
  if (customBgUrl) URL.revokeObjectURL(customBgUrl);
  customBgUrl = URL.createObjectURL(file); P.bg = 'custom'; savePrefs(); applyBg(); refreshSettings();
  toast('Background updated', saved ? '' : 'It could not be saved, so it lasts until you close the page.');
}
function refreshSettings() { if (app && app.data.cwd === 'settings') { renderContent(app); updateToolbar(app); } }
function setupBg() {
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (FX.id) fxInit(FX.id); }, 200); });
  const pick = $('#bg-pick');
  pick.addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; setCustomBg(f); });
  document.addEventListener('click', e => {
    const q = e.target.closest('[data-bgquick]'); if (q) { pick.click(); return; }
    if (e.target.closest('[data-bg-up]')) { pick.click(); return; }
    const t = e.target.closest('[data-bg]'); if (t) { P.bg = t.dataset.bg; savePrefs(); applyBg(); refreshSettings(); }
  });
  document.addEventListener('input', e => { if (e.target.id === 'bg-dim') { P.dim = +e.target.value; applyBg(); } });
  document.addEventListener('change', e => { if (e.target.id === 'bg-dim') savePrefs(); });
}

/* ---------- Settings page ---------- */
function settingsHTML() {
  const ch = (key, opts) => '<div class="choices">' + opts.map(o => '<button data-k="' + key + '" data-pv="' + o[0] + '" class="' + (String(P[key]) === String(o[0]) ? 'on' : '') + '">' + o[1] + '</button>').join('') + '</div>';
  return '<div class="page"><h2>Settings</h2><p class="sub">Saved on this device.</p>' + bgSettingsHTML() + '<div class="panel">' +
    '<div class="sw-row"><div>Appearance<small>Follow your system or choose a theme</small></div>' + ch('theme', [['auto', 'System'], ['light', 'Light'], ['dark', 'Dark']]) + '</div>' +
    '<div class="sw-row"><div>Icon size<small>Applies to the icon view</small></div>' + ch('icon', [[56, 'Small'], [72, 'Medium'], [96, 'Large']]) + '</div>' +
    '<div class="sw-row"><div>Default view</div>' + ch('view', [['icons', 'Icons'], ['list', 'List'], ['gallery', 'Gallery']]) + '</div>' +
    '<div class="sw-row"><div>File extensions<small>Hide to see names without .jpg, .pdf and so on</small></div>' + ch('ext', [[true, 'Show'], [false, 'Hide']]) + '</div></div>' +
    '<h4>Data</h4><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a2="examples">Add example files</button><button class="btn" data-a2="rm">Remove example files</button><button class="btn danger" data-a2="erase">Erase all data…</button></div><h4>About</h4><div class="panel">COSPACE keeps your files in this browser. Built by devanshhuw · GitHub: <a href="https://github.com/devanshhuw" target="_blank" rel="noopener">github.com/devanshhuw</a> · Quill: <a href="https://quill-com.vercel.app/" target="_blank" rel="noopener">quill-com.vercel.app</a></div></div>';
}
function settingsAction(b) {
  const k = b.dataset.k; let v = b.dataset.pv; if (k === 'icon') v = +v; if (k === 'ext' || k === 'fx') v = v === 'true';
  P[k] = v; savePrefs(); applyPrefs(); updateThemeBtn();
  if (k === 'view' && app) app.data.view = v;
  if (app) { renderContent(app); updateToolbar(app); }
}
async function settingsData(act) {
  if (act === 'examples') { await seedExamples(); refreshAll(); toast('Example files added'); }
  else if (act === 'rm') removeExamples();
  else if (act === 'erase' && await askConfirm({ title: 'Erase everything?', msg: 'All files, folders, tags and notes in COSPACE will be deleted from this browser. This can’t be undone.', ok: 'Erase all', danger: true })) {
    Array.from(items.keys()).forEach(dropThumb); items.clear(); resetMemo(); await DB.clearAll(); await DB.setKV('seeded', 1); refreshAll(); toast('COSPACE is empty');
  }
}

/* ---------- global events and start ---------- */
function setupEvents() {
  document.addEventListener('keydown', e => {
    if (!$('#scrim').hidden) return;
    const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable, mod = e.metaKey || e.ctrlKey;
    if ((mod && e.key.toLowerCase() === 'k') || (!typing && e.key === '/')) { e.preventDefault(); const q = $('#global-q'); q.focus(); q.select(); return; }
    if (!$('#ql').hidden) { if (!typing) qlKey(e); return; }
    if (e.key === 'Escape' && menuEl) { closeMenu(); return; }
    if (e.key === 'Escape' && app && app.el.classList.contains('side-open')) { app.el.classList.remove('side-open'); return; }
    if (typing) return;
    if (e.shiftKey && mod && e.key.toLowerCase() === 'n') { e.preventDefault(); newFolderPrompt(app); return; }
    if (!mod && !e.altKey && e.key.toLowerCase() === 'u' && !isPage(app.data.cwd)) { e.preventDefault(); chooseFiles(uploadTarget(app), false); return; }
    if (!isPage(app.data.cwd) || app.data.q) app.key(e);
  });
  $('#pick').addEventListener('change', e => { const l = filesFromInput(e.target); e.target.value = ''; if (l.length) ingestMany(l, pickTarget); });
  $('#pickdir').addEventListener('change', e => { const l = filesFromInput(e.target); e.target.value = ''; if (l.length) ingestMany(l, pickTarget, 'Adding folder'); });
  document.addEventListener('dragover', e => { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) e.preventDefault(); });
  document.addEventListener('drop', e => { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) e.preventDefault(); });
  window.addEventListener('beforeunload', () => thumbs.forEach(u => URL.revokeObjectURL(u)));
  $('#kbd-hint').textContent = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? '⌘K' : 'Ctrl K';
}
async function init() {
  applyPrefs();
  await DB.open(); await loadCustomBg(); applyBg();
  try { (await DB.allItems()).forEach(i => items.set(i.id, i)); } catch (e) { /* start empty */ }
  resetMemo();
  try { if (!(await DB.getKV('seeded')) && items.size === 0) await seedExamples(); } catch (e) { /* examples are optional */ }
  hydrateIcons(); updateThemeBtn();
  const w = createApp(); setupEvents(); setupQL(); setupBg();
  renderFinder(w); updateQuota();
  if (!DB.durable) toast('Temporary storage', 'This browser blocks permanent storage here. Files will be lost when you close the page.', { ms: 7000 });
}
init();
})();
</script>
